name: Build Sami Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'اختر نوع بناء الحزمة (Release أو Debug أو كلاهما)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Sami APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: 4. Build and Sync Web Client Assets
        run: |
          echo "Compiling Sami client updater..."
          npx esbuild src/client/samiCloudUpdater.tsx --bundle --format=esm --target=es2020 --outfile=public/assets/sami-updater.js
          if [ -f scripts/fix_react_hooks.py ]; then
            python3 scripts/fix_react_hooks.py
          fi
          mkdir -p app/src/main/assets/assets
          cp public/assets/sami-updater.js app/src/main/assets/assets/sami-updater.js
          echo "✓ Web assets bundled and copied to Android assets."

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 6. Ensure Gradle Wrapper Permissions & Files
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradlew gradle/wrapper/

      - name: 7. Verify Official Signing Keystore
        run: |
          if [ -f app/sami-signing-key.p12 ]; then
            echo "✓ Official signing key (app/sami-signing-key.p12) is ready."
            ls -lh app/sami-signing-key.p12
          else
            echo "⚠️ Notice: app/sami-signing-key.p12 missing. Gradle will fallback to debug signing."
          fi

      - name: 8. Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Building Release APK with Gradle 8.7..."
          ./gradlew assembleRelease -x test --no-daemon --stacktrace

      - name: 9. Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "Building Debug APK with Gradle 8.7..."
          ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: 10. Collect and Verify APK Outputs
        run: |
          mkdir -p output-apks

          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.3.1"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="15"; fi
          echo "Building for Version: v$VERSION_NAME (Build $VERSION_CODE)"

          # Copy and rename Release APK
          if [ -d "app/build/outputs/apk/release" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" "output-apks/Sami-v${VERSION_NAME}-b${VERSION_CODE}-release.apk"
              echo "✓ Release APK ready: Sami-v${VERSION_NAME}-b${VERSION_CODE}-release.apk"
            fi
          fi

          # Copy and rename Debug APK
          if [ -d "app/build/outputs/apk/debug" ]; then
            DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -n "$DEBUG_APK" ]; then
              cp "$DEBUG_APK" "output-apks/Sami-v${VERSION_NAME}-b${VERSION_CODE}-debug.apk"
              echo "✓ Debug APK ready: Sami-v${VERSION_NAME}-b${VERSION_CODE}-debug.apk"
            fi
          fi

          echo "============================================="
          echo "Generated APK Files in output-apks/:"
          ls -lh output-apks/
          echo "============================================="
          echo "SHA-256 Fingerprints:"
          sha256sum output-apks/*.apk || true
          echo "============================================="

      - name: 11. Upload APK Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Android-APK
          path: output-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 12. Create GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          generate_release_notes: true

      - name: 13. Publish Job Summary
        if: always()
        run: |
          echo "## 📱 تقرير بناء تطبيق Sami Android APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "output-apks" ] && [ "$(ls -A output-apks/*.apk 2>/dev/null)" ]; then
            echo "✅ **تم بناء حزمة الـ APK وتوقيعها بنجاح!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| اسم الملف | الحجم | بصمة SHA-256 |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            for apk in output-apks/*.apk; do
              if [ -f "$apk" ]; then
                NAME=$(basename "$apk")
                SIZE=$(ls -lh "$apk" | awk '{print $5}')
                SHA=$(sha256sum "$apk" | awk '{print $1}')
                echo "| **$NAME** | $SIZE | \`$SHA\` |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 **طريقة التحميل:** يمكنك تحميل الملف مباشرة من قسم **Artifacts** في أعلى صفحة هذا التشغيل." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ لم يتم العثور على ملفات APK مكتملة. يرجى مراجعة سجلات الخطوات السابقة." >> $GITHUB_STEP_SUMMARY
          fi
